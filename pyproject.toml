[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-ai-act"
version = "0.1.0"
description = "Asistente RAG de consulta del Reglamento (UE) 2024/1689"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49,<1",
    "beautifulsoup4>=4.12,<5",
    "chromadb>=0.6,<2",
    "fastapi>=0.115,<1",
    "langdetect>=1.0.9,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3.4,<6",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.uv]
package = true
